[project]
name = "atelier-pm-engine"
version = "0.1.0"
description = "Moteur DevFactory & Project Manager autonome d'Atelier (LangGraph, Redis Streams, pgvector RAG). Voir docs/specs/05-devfactory-pm-engine.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "SEE LICENSE IN ../../LICENSE" }

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  # `langgraph-checkpoint-postgres` ne fixe pas de driver psycopg par
  # defaut (aucune implementation "pq" n'est installee sinon, voir
  # verification empirique dans docs/PROGRESS.md) : `binary` evite une
  # dependance a `libpq` systeme dans l'image de production.
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.1,<6.0",
  "asyncpg>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  # SDK MCP officiel (Jalon M5, tache 5.2.2, `pm_engine.mcp_client`) : le
  # PM pilote le cycle de vie des Workshops via le meme serveur MCP externe
  # (`/v1/mcp`) qu'un client MCP externe (Claude Desktop/Cursor), jamais
  # par un raccourci interne. Depend en interne de `httpx2` (pas `httpx`),
  # les deux coexistent sans conflit.
  "mcp>=2.1,<3.0",
  # Consomme le flux SSE de reconnexion de exec_in_workshop
  # (`GET /v1/workshops/{name}/exec/{id}/stream`, tache 4.2.3 cote
  # atelier) — voir `pm_engine.exec_client`.
  "httpx-sse>=0.4,<1.0",
  # Verification JWT entrants (tache 5.5.1/5.5.2, `pm_engine.auth`) : le
  # Dashboard transmet le JWT utilisateur (deja verifie une premiere fois
  # cote `atelier-api-server`, voir `crates/api-server/src/auth.rs`) au PM
  # Engine, qui doit le revalider lui-meme (jamais faire confiance a un
  # en-tete non verifie provenant d'un autre service). `[crypto]` fournit
  # le support RS256/ES256 via `cryptography` (JWK RFC 7517).
  "pyjwt[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Jeu de regles ruff CHOISI, pas celui par defaut. Le defaut signale ici
# une majorite de faux positifs ou de churn (`SIM117` sur les `async with`
# imbriques, `TRY`/`PL` sur des tournures deliberees) qui rendrait le lint
# ininteressant a lire, donc ignore. Ne sont retenues que des regles dont
# une violation est un vrai defaut :
#   E9  erreurs de syntaxe/indentation
#   F   pyflakes (import mort, variable non definie, f-string sans champ)
#   I   ordre des imports (deterministe, evite les diffs de rebase)
#   UP  modernisation (`typing.AsyncIterator` -> `collections.abc`)
#   B   bugbear (pieges reels : defaut mutable, `zip` sans `strict`...)
#   BLE `except Exception:` nu — deja marque `# noqa: BLE001` a plusieurs
#       endroits de ce service, donc l'intention etait deja d'en faire un
#       choix explicite ; la regle rend ces marqueurs signifiants
#   RUF100  `# noqa` devenu inutile (une garde qui ne garde plus rien)
[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "B", "BLE", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Security` dans une valeur par defaut est L'IDIOME FastAPI, pas
# l'appel-dans-le-defaut que B008 cherche a attraper.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Header"]
