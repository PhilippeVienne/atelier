[project]
name = "atelier-pm-engine"
version = "0.1.0"
description = "Moteur DevFactory & Project Manager autonome d'Atelier (LangGraph, Redis Streams, pgvector RAG). Voir docs/specs/05-devfactory-pm-engine.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "SEE LICENSE IN ../../LICENSE" }

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  # `langgraph-checkpoint-postgres` ne fixe pas de driver psycopg par
  # defaut (aucune implementation "pq" n'est installee sinon, voir
  # verification empirique dans docs/PROGRESS.md) : `binary` evite une
  # dependance a `libpq` systeme dans l'image de production.
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.1,<6.0",
  "asyncpg>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  # SDK MCP officiel (Jalon M5, tache 5.2.2, `pm_engine.mcp_client`) : le
  # PM pilote le cycle de vie des Workshops via le meme serveur MCP externe
  # (`/v1/mcp`) qu'un client MCP externe (Claude Desktop/Cursor), jamais
  # par un raccourci interne. Depend en interne de `httpx2` (pas `httpx`),
  # les deux coexistent sans conflit.
  "mcp>=2.1,<3.0",
  # Consomme le flux SSE de reconnexion de exec_in_workshop
  # (`GET /v1/workshops/{name}/exec/{id}/stream`, tache 4.2.3 cote
  # atelier) — voir `pm_engine.exec_client`.
  "httpx-sse>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
