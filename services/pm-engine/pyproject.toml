[project]
name = "atelier-pm-engine"
version = "0.1.0"
description = "Moteur DevFactory & Project Manager autonome d'Atelier (LangGraph, Redis Streams, pgvector RAG). Voir docs/specs/05-devfactory-pm-engine.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "SEE LICENSE IN ../../LICENSE" }

# Perimetre de ce lot (Jalon M5, taches 5.1.1/5.1.2 du plan) : uniquement le
# scaffolding du projet (dependances + `/health`), pas de graphe LangGraph
# fonctionnel (taches 5.2.x, hors perimetre, dependent du serveur MCP M4
# pas encore construit). Les dependances ci-dessous sont neanmoins toutes
# reellement necessaires a terme (voir docs/specs/05-devfactory-pm-engine.md)
# et sont deja epinglees pour que ce scaffolding s'installe reellement.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  # `langgraph-checkpoint-postgres` ne fixe pas de driver psycopg par
  # defaut (aucune implementation "pq" n'est installee sinon, voir
  # verification empirique dans docs/PROGRESS.md) : `binary` evite une
  # dependance a `libpq` systeme dans l'image de production.
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.1,<6.0",
  "asyncpg>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
