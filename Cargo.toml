[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/controller",
    "crates/api-server",
    "crates/firecracker",
    "crates/vm-supervisor",
    "crates/builder-vm-init",
    "crates/net-proxy",
    "crates/identity-proxy",
    "crates/mcp-gateway",
    "crates/image-builder",
    "crates/kvm-device-plugin",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/PhilippeVienne/atelier"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
kube = { version = "0.98", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
schemars = "0.8"
axum = "0.8"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
