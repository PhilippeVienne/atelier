{{- if .Values.squadToken.signingKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "squad-token") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
type: Opaque
stringData:
  # Lu par le SEUL controller (crates/controller/src/reconcile.rs,
  # ATELIER_SQUAD_TOKEN_SIGNING_KEY) — jamais transmis tel quel a un
  # Workshop, voir crates/common/src/squad_token.rs.
  SIGNING_KEY: {{ .Values.squadToken.signingKey | quote }}
{{- end }}
