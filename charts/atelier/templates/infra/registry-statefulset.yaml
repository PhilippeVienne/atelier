{{- if and .Values.registry.enabled (not .Values.registry.external.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "registry") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "registry") | nindent 4 }}
spec:
  serviceName: {{ include "atelier.componentName" (dict "root" $ "component" "registry") }}
  # Un seul replica : l'image officielle "registry:2" utilise un stockage
  # filesystem local (pas de backend partage configure ici), pas de
  # coordination multi-instance sans backend S3/GCS distant.
  replicas: 1
  selector:
    matchLabels:
      {{- include "atelier.selectorLabels" (dict "root" $ "component" "registry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atelier.selectorLabels" (dict "root" $ "component" "registry") | nindent 8 }}
    spec:
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
      {{- if not .Values.registry.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.registry.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.registry.persistence.storageClassName | default .Values.global.storageClassName) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.registry.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "registry") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "registry") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.registry.service.port }}
      targetPort: http
{{- end }}
