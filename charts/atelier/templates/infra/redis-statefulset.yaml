{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "redis") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "redis") | nindent 4 }}
spec:
  serviceName: {{ include "atelier.componentName" (dict "root" $ "component" "redis") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "atelier.selectorLabels" (dict "root" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atelier.selectorLabels" (dict "root" $ "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # AOF pour ne pas perdre les entrees de Redis Streams (files de
          # messages du PM Engine, Jalon M5) en cas de redemarrage du pod.
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      {{- if not .Values.redis.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.redis.persistence.storageClassName | default .Values.global.storageClassName) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- end }}
{{- end }}
