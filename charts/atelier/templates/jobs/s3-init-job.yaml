{{- if .Values.initJobs.s3Init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "s3-init") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJobs.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "atelier.selectorLabels" (dict "root" $ "component" "s3-init") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "atelier.componentName" (dict "root" $ "component" "init-jobs") }}
      containers:
        - name: s3-init
          image: "{{ .Values.initJobs.s3Init.image.repository }}:{{ .Values.initJobs.s3Init.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -eu
              until mc alias set atelier "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" {{ if .Values.s3Storage.external.forcePathStyle }}--path=on{{ end }}; do
                echo "en attente du endpoint S3...";
                sleep 3;
              done
              for bucket in "{{ .Values.s3Storage.buckets.sessions }}" "{{ .Values.s3Storage.buckets.snapshots }}" "{{ .Values.s3Storage.buckets.forgejo }}" "{{ .Values.s3Storage.buckets.imageCache }}"; do
                if mc ls "atelier/$bucket" >/dev/null 2>&1; then
                  echo "bucket $bucket deja present (idempotent)";
                else
                  mc mb "atelier/$bucket";
                  echo "bucket $bucket cree";
                fi
              done
          env:
            {{- if .Values.s3Storage.external.enabled }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3Storage.external.endpoint | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudIdentity.fallbackSecretName }}
                  key: accessKeyId
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudIdentity.fallbackSecretName }}
                  key: secretAccessKey
            {{- else }}
            - name: S3_ENDPOINT
              value: "http://{{ include "atelier.componentName" (dict "root" $ "component" "rustfs") }}:{{ .Values.s3Storage.rustfs.service.port }}"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atelier.componentName" (dict "root" $ "component" "rustfs-auth") }}
                  key: RUSTFS_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atelier.componentName" (dict "root" $ "component" "rustfs-auth") }}
                  key: RUSTFS_SECRET_KEY
            {{- end }}
{{- end }}
