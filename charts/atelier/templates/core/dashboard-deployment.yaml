{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "dashboard") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "atelier.selectorLabels" (dict "root" $ "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atelier.selectorLabels" (dict "root" $ "component" "dashboard") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.service.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.dashboard.service.port | quote }}
            {{- if .Values.apiServer.enabled }}
            - name: ATELIER_API_SERVER_URL
              value: "http://{{ include "atelier.componentName" (dict "root" $ "component" "apiserver") }}:{{ .Values.apiServer.service.port }}"
            {{- end }}
            - name: ATELIER_OAUTH2_CLIENT_ID
              value: "atelier-dashboard"
            - name: ATELIER_OAUTH2_REDIRECT_URI
              value: "https://{{ .Values.domains.dashboard }}/api/auth/callback"
            {{- if .Values.keycloak.enabled }}
            - name: ATELIER_OIDC_ISSUER_URL
              value: "https://{{ .Values.domains.keycloak }}/realms/{{ .Values.keycloak.realmName }}"
            {{- else if .Values.keycloak.external.enabled }}
            - name: ATELIER_OIDC_ISSUER_URL
              value: "{{ .Values.keycloak.external.url }}/realms/{{ .Values.keycloak.realmName }}"
            {{- end }}
            - name: ATELIER_OIDC_AUTHORIZE_PATH
              value: "/protocol/openid-connect/auth"
            - name: ATELIER_OIDC_TOKEN_PATH
              value: "/protocol/openid-connect/token"
            {{- range $k, $v := .Values.dashboard.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
