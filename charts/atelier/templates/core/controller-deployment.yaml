{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "controller") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "controller") | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "atelier.selectorLabels" (dict "root" $ "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atelier.selectorLabels" (dict "root" $ "component" "controller") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.controller.serviceAccount.name | default (include "atelier.componentName" (dict "root" $ "component" "controller")) }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: "info,atelier_controller=debug"
            - name: ATELIER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATELIER_API_SERVER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATELIER_API_SERVER_SERVICE_ACCOUNT
              value: {{ .Values.apiServer.serviceAccount.name | default (include "atelier.componentName" (dict "root" $ "component" "apiserver")) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "atelier.postgresSecretName" $ }}
                  key: controllerDatabaseUrl
            {{- /*
            Le controller (crates/controller/src/openbao.rs::config_from_env)
            EXIGE OPENBAO_TOKEN des que OPENBAO_ADDR est present (echec au
            demarrage sinon — verifie empiriquement). Contrairement a
            api-server/identity-proxy, il n'a pas encore de flux d'auth
            Kubernetes propre pour ce provisioning cluster-wide (role
            OpenBao pour api-server). Ne definir OPENBAO_ADDR que si un
            token est effectivement disponible (devMode ou secret fourni),
            sinon laisser le controller tourner sans OpenBao (comportement
            optionnel documente dans crates/controller/src/main.rs).
            */}}
            {{- if and .Values.openbao.enabled .Values.openbao.devMode }}
            - name: OPENBAO_ADDR
              value: "http://{{ include "atelier.componentName" (dict "root" $ "component" "openbao") }}:{{ .Values.openbao.service.port }}"
            - name: OPENBAO_TOKEN
              value: "root"
            {{- else if and .Values.openbao.enabled .Values.openbao.rootTokenSecretName }}
            - name: OPENBAO_ADDR
              value: "http://{{ include "atelier.componentName" (dict "root" $ "component" "openbao") }}:{{ .Values.openbao.service.port }}"
            - name: OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openbao.rootTokenSecretName }}
                  key: token
            {{- end }}
            {{- if .Values.registry.enabled }}
            - name: ATELIER_REGISTRY_ADDR
              value: {{ if .Values.registry.external.enabled }}{{ .Values.registry.external.addr | quote }}{{ else }}{{ printf "%s:%v" (include "atelier.componentName" (dict "root" $ "component" "registry")) .Values.registry.service.port | quote }}{{ end }}
            - name: ATELIER_REGISTRY_INSECURE
              value: {{ .Values.registry.insecure | quote }}
            {{- end }}
            {{- if .Values.observability.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "atelier.componentName" (dict "root" $ "component" "observability") }}:4317"
            {{- end }}
            {{- /*
            CA d'entreprise (tache 11.2, spec docs/specs/15-souverainete-
            airgap-inference-gpu.md §3.2/§3.3) : le controller ne s'en sert
            pas lui-meme, il retransmet seulement le NOM de la ConfigMap
            (deja creee par ce chart, tache 11.1) au Job image-builder qu'il
            cree (ensure_image_build_job), meme structure que
            ATELIER_REGISTRY_ADDR/S3_* ci-dessus.
            */}}
            {{- if .Values.tls.customCaBundle }}
            - name: ATELIER_CA_BUNDLE_CONFIGMAP
              value: {{ include "atelier.componentName" (dict "root" $ "component" "ca-bundle") | quote }}
            {{- end }}
            {{- /*
            Tache 12.2 : secret GLOBAL de signature des jetons d'escouade,
            lu par le SEUL controller (qui derive ensuite une cle PAR
            CAMPAGNE, jamais transmise telle quelle a un Workshop — voir
            crates/common/src/squad_token.rs). Absent si
            squadToken.signingKey est vide (fonctionnalite desactivee par
            defaut).
            */}}
            {{- if .Values.squadToken.signingKey }}
            - name: ATELIER_SQUAD_TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atelier.componentName" (dict "root" $ "component" "squad-token") }}
                  key: SIGNING_KEY
            {{- end }}
            {{- /*
            Offload S3 du cache d'images (spec docs/specs/13-image-cache-
            offload.md, tache 8.3) : le controller ne s'en sert pas
            directement, il retransmet cette configuration au Job
            image-builder qu'il cree (ensure_image_build_job). Meme
            structure if/else que s3-init-job.yaml (RustFS embarque vs S3
            externe/Cloud).
            */}}
            {{- if .Values.s3Storage.external.enabled }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3Storage.external.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.s3Storage.external.region | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.s3Storage.external.forcePathStyle | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudIdentity.fallbackSecretName }}
                  key: accessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudIdentity.fallbackSecretName }}
                  key: secretAccessKey
            - name: S3_BUCKET_SESSIONS
              value: {{ .Values.s3Storage.buckets.sessions | quote }}
            - name: S3_BUCKET_SNAPSHOTS
              value: {{ .Values.s3Storage.buckets.snapshots | quote }}
            - name: S3_BUCKET_IMAGE_CACHE
              value: {{ .Values.s3Storage.buckets.imageCache | quote }}
            {{- else if .Values.s3Storage.rustfs.enabled }}
            - name: S3_ENDPOINT
              value: "http://{{ include "atelier.componentName" (dict "root" $ "component" "rustfs") }}:{{ .Values.s3Storage.rustfs.service.port }}"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "atelier.componentName" (dict "root" $ "component" "rustfs-auth") }}
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atelier.componentName" (dict "root" $ "component" "rustfs-auth") }}
                  key: RUSTFS_SECRET_KEY
            - name: S3_BUCKET_SESSIONS
              value: {{ .Values.s3Storage.buckets.sessions | quote }}
            - name: S3_BUCKET_SNAPSHOTS
              value: {{ .Values.s3Storage.buckets.snapshots | quote }}
            - name: S3_BUCKET_IMAGE_CACHE
              value: {{ .Values.s3Storage.buckets.imageCache | quote }}
            {{- end }}
            # Eviction LRU du cache d'images (spec docs/specs/13-image-
            # cache-offload.md, tache 8.5) : sans effet si S3_BUCKET_
            # IMAGE_CACHE n'est pas configure ci-dessus (l'eviction reste
            # alors desactivee, voir crate::eviction).
            - name: ATELIER_IMAGE_CACHE_EVICTION_THRESHOLD_GB
              value: {{ .Values.imageCache.evictionThresholdGb | quote }}
            {{- range $k, $v := .Values.controller.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            # Le controller n'expose qu'une seule sonde `/health/ready`
            # (verifie Kubernetes + PostgreSQL + OpenBao) — pas de notion de
            # liveness separee, voir crates/controller/src/health.rs.
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
{{- end }}
