{{- if and .Values.controller.enabled .Values.controller.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount.name | default (include "atelier.componentName" (dict "root" $ "component" "controller")) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "controller") | nindent 4 }}
  annotations:
    {{- include "atelier.cloudIdentityAnnotations" $ | nindent 4 }}
    {{- with .Values.controller.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
{{- if and .Values.apiServer.enabled .Values.apiServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.apiServer.serviceAccount.name | default (include "atelier.componentName" (dict "root" $ "component" "apiserver")) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "apiserver") | nindent 4 }}
  annotations:
    {{- include "atelier.cloudIdentityAnnotations" $ | nindent 4 }}
    {{- with .Values.apiServer.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
{{- if and .Values.pmEngine.enabled .Values.pmEngine.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.pmEngine.serviceAccount.name | default (include "atelier.componentName" (dict "root" $ "component" "pm-engine")) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "pm-engine") | nindent 4 }}
  annotations:
    {{- include "atelier.cloudIdentityAnnotations" $ | nindent 4 }}
    {{- with .Values.pmEngine.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
# ServiceAccount dedie aux Jobs d'initialisation Helm (hooks) : ne porte
# aucune permission RBAC particuliere par defaut (les Jobs parlent aux
# services applicatifs directement, pas a l'API Kubernetes), mais recoit les
# memes annotations d'identite Cloud pour pouvoir, par exemple, assumer un
# role IAM le temps de creer les buckets S3 (s3-init-job).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atelier.componentName" (dict "root" $ "component" "init-jobs") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atelier.labels" $ | nindent 4 }}
    {{- include "atelier.selectorLabels" (dict "root" $ "component" "init-jobs") | nindent 4 }}
  annotations:
    {{- include "atelier.cloudIdentityAnnotations" $ | nindent 4 }}
