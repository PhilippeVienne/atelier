apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workshops.atelier.dev
spec:
  group: atelier.dev
  names:
    categories: []
    kind: Workshop
    plural: workshops
    shortNames:
    - wks
    singular: workshop
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WorkshopSpec via `CustomResource`
        properties:
          spec:
            description: 'Un `Workshop` decrit un environnement isole fourni a un agent de code : source devcontainer, ressources allouees, politique reseau et outillage active.'
            properties:
              allowedInternalTargets:
                default: []
                description: 'Cibles internes explicitement autorisees vers D''AUTRES Workshops, format `<service>.<workshop-cible>.atelier.internal:<port>` — jamais de wildcard (spec 16 §3.2, "Validation Nominative des Cibles, Zero Wildcard") : une cible absente de cette liste reste inaccessible, quand bien meme elle appartiendrait a la meme campagne. Resolu par le `controller` en adresses reelles (ClusterIP du Service correspondant) et transmis au `net-proxy` de CE Workshop (`crates/net-proxy/src/internal.rs`, table `squad`).'
                items:
                  type: string
                type: array
              campaignId:
                description: 'Identifiant de campagne multi-Workshops (spec 16 §3.2/§4) : les Workshops d''une meme campagne (meme valeur ici) ET du meme `owner_group` peuvent s''echanger des paquets au niveau reseau K8s (`NetworkPolicy` generee par le controller, voir `crates/controller/src/reconcile.rs::campaign_network_policy`) — tout le reste du trafic inter-pod est detruit au niveau noyau. `None` : Workshop solitaire, comportement inchange (aucune `NetworkPolicy` generee par ce mecanisme).'
                nullable: true
                type: string
              desiredState:
                default: Running
                description: 'Etat souhaite : `Running` (microVM active) ou `Suspended` (mise en veille via snapshot Firecracker, pod parent libere). Le controller fait converger `status.phase` vers cet etat.'
                enum:
                - Running
                - Suspended
                type: string
              devcontainer:
                description: Definition de l'environnement au format devcontainer.json (spec VS Code Dev Containers). C'est cette source qui est construite en rootfs bootable par le composant `image-builder`.
                properties:
                  configPath:
                    default: .devcontainer/devcontainer.json
                    description: Chemin vers le fichier devcontainer.json dans le depot.
                    type: string
                  repo:
                    description: URL du depot git contenant la definition devcontainer.
                    type: string
                  revision:
                    default: HEAD
                    description: Branche, tag ou commit a utiliser.
                    type: string
                required:
                - repo
                type: object
              egressAllowlist:
                default: []
                description: Politique reseau de sortie appliquee par le net-proxy (domaines autorises).
                items:
                  type: string
                type: array
              exportedServices:
                default: []
                description: 'Ports applicatifs exposes aux AUTRES Workshops d''une meme campagne (spec `docs/specs/16-escouades-multi-agents-swarms-mesh.md` §3.2, tache 12.1) — jamais a Internet ni au reste du cluster. Chaque entree devient un Service Kubernetes `<workshop>-<name>` (voir `crates/controller/src/reconcile.rs::ensure_exported_service`) et un relais TCP dans le `net-proxy` de CE Workshop (`crates/net-proxy/src/ ingress.rs`) : sans ce relais, rien n''ecoute sur l''IP du pod pour un port applicatif (celui-ci n''existe que dans le netns de la microVM, voir la doc de tete de `crate::guest_probe`).'
                items:
                  description: Un port applicatif expose aux autres Workshops de la meme campagne — voir la doc du champ `WorkshopSpec::exported_services`.
                  properties:
                    name:
                      description: 'Nom logique, unique parmi les services exportes de ce Workshop : determine a la fois le nom du Service Kubernetes cree (`<workshop>-<name>`) et le sous-domaine de l''alias resolu par les AUTRES Workshops (`<name>.<workshop>.atelier.internal`).'
                      type: string
                    port:
                      description: Port TCP, a la fois cote Service Kubernetes et cote microVM (le `net-proxy` de ce Workshop relaie tel quel, sans traduction de port).
                      format: uint16
                      minimum: 0.0
                      type: integer
                  required:
                  - name
                  - port
                  type: object
                type: array
              identityInjectionRules:
                default: []
                description: 'Regles d''injection de credentials appliquees par `identity-proxy` aux appels sortants de l''agent (jamais exposees en clair a la VM, voir `docs/architecture/network-security.md`). Vide : identity-proxy relaie sans jamais injecter.'
                items:
                  description: |-
                    Une regle d'injection `identity-proxy` : les requetes sortantes de l'agent dont l'hote correspond a `host` (correspondance exacte ou wildcard `*.domaine`, meme syntaxe que `egress_allowlist`) recoivent l'en-tete `header` construit comme `prefix` + la valeur du champ `field` du secret OpenBao stocke sous `secret/workshops/<name>/<secret_path>`. Meme forme que `crates/identity-proxy/src/rules.rs::InjectionRule` (serialisee telle quelle vers `ATELIER_IDENTITY_INJECTION_RULES`, JSON).

                    `PartialEq` : `identity-proxy` compare les regles rechargees aux precedentes pour ne journaliser que les vrais changements.
                  properties:
                    field:
                      default: value
                      type: string
                    header:
                      type: string
                    host:
                      type: string
                    prefix:
                      default: ''
                      type: string
                    secretPath:
                      type: string
                  required:
                  - header
                  - host
                  - secretPath
                  type: object
                type: array
              ownerGroup:
                description: |-
                  Groupe proprietaire : c'est LUI qui donne acces (voir `docs/specs/07-groupes.md`). Tout membre du groupe peut piloter ce Workshop, ce qui permet notamment de reprendre l'environnement d'un collegue absent.

                  Obligatoire : le repli sur `owner_subject` qui accompagnait la transition a ete retire (voir `docs/specs/07-groupes.md`). Un Workshop sans groupe n'aurait aucun perimetre d'acces defini, et laisser ce cas possible revenait a garder deux regles d'autorisation en parallele — celle qui se serait tue en premier.
                type: string
              ownerSubject:
                description: |-
                  Sujet JWT qui a CREE ce Workshop.

                  Ne donne plus l'acces des lors qu'`owner_group` est renseigne : il repond a « qui l'a provisionne » (audit, tracabilite), pas a « qui y a droit ». Conserve pour cette raison, y compris apres le depart de la personne du groupe.
                type: string
              resources:
                description: Ressources allouees au pod parent (qui heberge la microVM + le tooling).
                properties:
                  cpu:
                    type: string
                  disk:
                    nullable: true
                    type: string
                  maxLlmBudgetUsd:
                    description: Budget maximal en dollars US alloue a la Virtual Key LiteLLM de ce Workshop (voir `docs/specs/03-litellm-proxy.md`). Absent = pas de plafond specifique impose par le Workshop (comportement par defaut de LiteLLM/politique globale du cluster).
                    format: double
                    nullable: true
                    type: number
                  memory:
                    type: string
                required:
                - cpu
                - memory
                type: object
              simulators:
                default: []
                description: 'Simulateurs ephemeres deployes en sidecars dans le pod parent (spec `docs/specs/14-devex-cli-simulateurs-hitl.md` §4, tache 9.3) : dependances d''appoint (base de donnees, mock d''API) pour les tests de l''agent, sans acces Internet et sans alourdir la microVM elle-meme. Chaque entree devient joignable in-VM via `<name>.atelier.internal` (voir `crates/net-proxy/src/internal.rs`).'
                items:
                  description: Un simulateur sidecar declare pour un `Workshop` — voir la doc du champ `WorkshopSpec::simulators`.
                  properties:
                    env:
                      additionalProperties:
                        type: string
                      default: {}
                      description: 'Variables d''environnement transmises telles quelles au conteneur sidecar (ex: `POSTGRES_DB`, `POSTGRES_PASSWORD` pour `Postgres`).'
                      type: object
                    name:
                      description: 'Nom logique, unique parmi les simulateurs de ce Workshop : devient le sous-domaine de l''alias `<name>.atelier.internal`. Independant de `type_` pour permettre plusieurs instances d''un meme type (ex: deux bases Postgres distinctes) sous des noms differents.'
                      type: string
                    type:
                      description: 'Type d''un simulateur sidecar : determine l''image de conteneur et le port interne par defaut utilises par `crates/controller/src/reconcile.rs`.'
                      enum:
                      - postgres
                      - localstack
                      - wiremock
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              tools:
                default: []
                description: 'Outils/simulateurs a exposer via le mcp-gateway (ex: "aws-sim", "identity").'
                items:
                  type: string
                type: array
            required:
            - devcontainer
            - ownerGroup
            - ownerSubject
            - resources
            type: object
          status:
            nullable: true
            properties:
              conditions:
                additionalProperties:
                  type: string
                default: {}
                type: object
              imageDigest:
                description: |-
                  Digest de l'image rootfs construite par `image-builder` a partir du devcontainer, une fois le build termine (cache content-addressed).

                  `skip_serializing_if` est ESSENTIEL ici : ce champ est ecrit par `image-builder` (depuis son Job), pas par le controller, alors que les deux patchent `status`. Sans lui, un `None` cote controller part en `"imageDigest": null` dans le JSON merge patch, ce que l'API Kubernetes interprete comme une SUPPRESSION du champ — le digest tout juste publie par `image-builder` etait alors efface, et le Workshop restait bloque en `BuildingImage` indefiniment alors que son image existait bel et bien dans le cache. Bug reel, observe environ une fois sur trois builds simultanes (2026-08-30).
                nullable: true
                type: string
              phase:
                enum:
                - Pending
                - Provisioning
                - Running
                - Terminating
                - Failed
                - BuildingImage
                - Suspending
                - Suspended
                - Resuming
                type: string
              podName:
                nullable: true
                type: string
              snapshotDigest:
                description: |-
                  Reference du dernier snapshot Firecracker (etat VM + memoire) pris par `vm-supervisor` lors d'une mise en veille, dans le meme cache content-addressed que `image_digest`. Absent si le Workshop n'a jamais ete suspendu.

                  Meme `skip_serializing_if` que `image_digest`, et pour la meme raison : ecrit par `vm-supervisor` via le controller, il ne doit jamais etre efface par un patch qui ne le renseigne simplement pas.
                nullable: true
                type: string
              upgradeState:
                description: 'Positionne par le controller (jamais par l''utilisateur) quand le hash du template de pod parent observe differe de celui utilise pour provisionner la microVM en cours d''execution — typiquement apres un `helm upgrade` qui change l''image `atelier-controller`/`atelier-api-server`. Un `helm upgrade` ne redemarre donc jamais une microVM Firecracker active de force : ce champ signale seulement qu''un redemarrage (via un cycle suspend/resume manuel, ou a la prochaine liberation du pod) sera necessaire pour que ce Workshop beneficie de la nouvelle version. Voir `docs/specs/02-helm-deployment-admin-doc.md`, section 1.1.'
                enum:
                - NeedsRestartForUpgrade
                nullable: true
                type: string
            required:
            - phase
            type: object
        required:
        - spec
        title: Workshop
        type: object
    served: true
    storage: true
    subresources:
      status: {}
