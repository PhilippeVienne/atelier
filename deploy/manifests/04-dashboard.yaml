apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-dashboard
  namespace: atelier-system
  labels:
    app.kubernetes.io/name: atelier-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atelier-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atelier-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/philippevienne/atelier-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: ATELIER_API_URL
              value: "http://atelier-api-server.atelier-system.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-dashboard
  namespace: atelier-system
  labels:
    app.kubernetes.io/name: atelier-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: atelier-dashboard
