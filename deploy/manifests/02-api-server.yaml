apiVersion: v1
kind: ServiceAccount
metadata:
  name: atelier-api-server
  namespace: atelier-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atelier-api-server-role
rules:
  - apiGroups: ["atelier.dev"]
    resources: ["workshops", "workshops/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/portforward"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atelier-api-server-binding
subjects:
  - kind: ServiceAccount
    name: atelier-api-server
    namespace: atelier-system
roleRef:
  kind: ClusterRole
  name: atelier-api-server-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-api-server
  namespace: atelier-system
  labels:
    app.kubernetes.io/name: atelier-api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: atelier-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atelier-api-server
    spec:
      serviceAccountName: atelier-api-server
      containers:
        - name: api-server
          image: ghcr.io/philippevienne/atelier-api-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RUST_LOG
              value: "info,atelier_api_server=debug"
            - name: ATELIER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-api-server
  namespace: atelier-system
  labels:
    app.kubernetes.io/name: atelier-api-server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: atelier-api-server
