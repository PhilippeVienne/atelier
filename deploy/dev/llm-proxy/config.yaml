# Configuration LiteLLM (voir deploy/dev/llm-proxy/README.md) : traduit les
# appels Anthropic Messages API de Claude Code (`/v1/messages`) vers un
# fournisseur bon marche par defaut (DeepSeek), avec un alias explicite vers
# le vrai Anthropic Sonnet pour les taches complexes. Les cles des
# fournisseurs (`os.environ/...`) viennent du Secret Kubernetes
# `atelier-llm-proxy-dev`, jamais de ce fichier.
model_list:
  # Alias capte par defaut par Claude Code (nom de modele Anthropic
  # standard) : redirige silencieusement vers DeepSeek, c'est le coeur de
  # la reduction de cout.
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      # Endpoint nativement compatible Anthropic de DeepSeek
      # (`api.deepseek.com/anthropic`) plutot que le provider `deepseek/`,
      # qui impose une traduction Anthropic -> OpenAI -> DeepSeek. Claude
      # Code parle Anthropic nativement : un aller-retour de traduction en
      # moins, c'est autant de fidelite preservee sur `tool_use`, qui porte
      # toute la boucle agentique.
      #
      # Ce n'est PAS ce qui expliquait les PR vides du PM (cause reelle :
      # les requetes suivantes du keep-alive vers `llm-proxy` relayees en
      # forme absolue par net-proxy, `404` cote uvicorn — voir
      # docs/architecture/pieges.md). Choix de robustesse, pas correctif.
      model: anthropic/deepseek-chat
      api_base: https://api.deepseek.com/anthropic
      api_key: os.environ/DEEPSEEK_API_KEY

  # Claude Code choisit lui-meme son modele par defaut, et ce nom evolue a
  # chaque version du CLI (`claude-opus-4-8[1m]` constate en pratique le
  # 2026-08-30 dans une microVM de Workshop). Maintenir un alias exact par
  # version serait a refaire indefiniment : ce wildcard capte donc tout nom
  # de modele non explicitement liste au-dessus et le route vers DeepSeek.
  #
  # A ne pas confondre avec la panne qui a motive son ajout : Claude Code
  # affiche un avertissement sur le modele meme quand il fonctionne, et la
  # vraie cause des PR vides du PM etait ailleurs (alias `llm-proxy` non
  # resolvable par DNS, voir docs/architecture/pieges.md). Ce wildcard reste
  # utile — un modele inconnu de LiteLLM echouerait pour de bon — mais il ne
  # remplace pas ce correctif.
  #
  # Place APRES les alias explicites : LiteLLM privilegie une correspondance
  # exacte, le wildcard ne sert que de repli.
  - model_name: "*"
    litellm_params:
      # Meme endpoint Anthropic natif que l'alias ci-dessus : ce wildcard
      # capte le modele par defaut de Claude Code, il doit donc offrir la
      # meme fidelite sur `tool_use`.
      model: anthropic/deepseek-chat
      api_base: https://api.deepseek.com/anthropic
      api_key: os.environ/DEEPSEEK_API_KEY

  # Meme cible, alias explicite pour un `claude --model deepseek-dev`
  # delibere plutot qu'implicite.
  - model_name: deepseek-dev
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # Vrai Anthropic, a la demande (`claude --model sonnet-premium`) pour les
  # arbitrages d'architecture complexes ou le modele low-cost ne suffit pas.
  - model_name: sonnet-premium
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # Modele de test (Jalon M3, `crates/controller/tests/litellm.rs`) : ne
  # contacte jamais de vrai fournisseur (`mock_response`, fonctionnalite
  # LiteLLM native), aucune cle requise. `model_info.*_cost_per_token` force
  # un cout non nul par appel (LiteLLM ne connait pas de tarif par defaut
  # pour un nom de modele arbitraire/mock) : indispensable pour tester
  # l'enforcement reel d'un budget de Virtual Key (`max_budget`) sans jamais
  # depenser un centime aupres d'un fournisseur payant.
  - model_name: atelier-budget-test
    litellm_params:
      # Prefixe `openai/` requis par le routeur LiteLLM (choix de provider),
      # meme si `mock_response` court-circuite tout appel HTTP reel — un nom
      # sans prefixe echoue au routage ("LLM Provider NOT provided",
      # constate en pratique). N'importe quel provider convient ici, aucune
      # cle n'est jamais utilisee.
      model: openai/atelier-budget-test
      mock_response: "ok"
    model_info:
      input_cost_per_token: 0.5
      output_cost_per_token: 0.5

  # Modele de test pour `pm_engine.nodes.plan_parallel_tasks` (Jalon M5,
  # tache 5.2.2) : DEEPSEEK_API_KEY/ANTHROPIC_API_KEY ne sont que des
  # valeurs de bouchon dans cet environnement de dev (jamais de vraie cle
  # payante provisionnee ici) — `mock_response` reste la seule facon de
  # tester pour de vrai (vrai aller-retour LiteLLM, juste sans fournisseur
  # payant reel) le chemin "heureux" de parsing JSON de ce noeud.
  - model_name: atelier-plan-test
    litellm_params:
      model: openai/atelier-plan-test
      mock_response: '[{"id":"task-1","title":"Backend","scope":["crates/**"]},{"id":"task-2","title":"Frontend","scope":["dashboard/**"]}]'
    model_info:
      input_cost_per_token: 0.5
      output_cost_per_token: 0.5

  # Modele d'embedding leger pour valider les tests vectoriels `pgvector` en
  # dev sans cle payante bloquante (Jalon M5, tache 5.0.2 — voir
  # `services/pm-engine`, table `project_memories`). Route vers Ollama
  # (`deploy/dev/ollama`, service global du cluster, meme niveau que ce
  # LiteLLM), entierement local. L'API d'inference hebergee de Hugging Face
  # (`huggingface/sentence-transformers/...`) exige desormais une
  # authentification meme pour un modele public (verifie empiriquement,
  # voir `deploy/dev/ollama/README.md`) — contraire a l'objectif de cette
  # tache. Dimension native 384, differente de `VECTOR(1536)` (calibree sur
  # `text-embedding-3-small`, voir
  # `services/pm-engine/migrations/20260824000000_init_pm_engine.sql`) : ne
  # pas ecrire directement dans `project_memories` avec ce modele sans
  # adaptation (re-projection ou colonne dediee aux tests dev).
  - model_name: embedding-dev-local
    litellm_params:
      model: ollama/all-minilm
      api_base: http://atelier-ollama-dev:11434

litellm_settings:
  # Evite les rejets sur des arguments specifiques a l'API Anthropic que le
  # backend cible (DeepSeek, via une traduction OpenAI-compatible) ne
  # reconnait pas.
  drop_params: true
  set_verbose: false
