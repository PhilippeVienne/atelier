apiVersion: v1
kind: Secret
metadata:
  name: atelier-postgres-dev
  namespace: default
type: Opaque
stringData:
  POSTGRES_PASSWORD: dev-only-not-for-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atelier-postgres-dev-init
  namespace: default
data:
  01-app-role.sql: |
    -- Execute une seule fois, au tout premier demarrage du conteneur
    -- (mecanisme standard de l'image officielle postgres,
    -- /docker-entrypoint-initdb.d/). CREATE ROLE est global a l'instance,
    -- pas a une base precise : ce role est donc aussi utilisable depuis
    -- `atelier_controller` (creee ensuite a la main, voir README.md).
    --
    -- Mot de passe en clair ici comme `POSTGRES_PASSWORD` ci-dessus : cette
    -- instance est jetable et dev-only (`emptyDir`, jamais exposee hors du
    -- cluster kind local), pas de secret reel a proteger.
    CREATE ROLE atelier_app LOGIN PASSWORD 'dev-only-not-for-production' NOSUPERUSER NOBYPASSRLS;
    GRANT CONNECT ON DATABASE atelier_apiserver TO atelier_app;
    GRANT USAGE ON SCHEMA public TO atelier_app;
    -- Les migrations (executees par atelier_admin) creent les tables apres
    -- ce script d'init : ALTER DEFAULT PRIVILEGES couvre les tables pas
    -- encore creees au lieu d'un GRANT explicite qui echouerait ici.
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO atelier_app;
---
apiVersion: v1
kind: Pod
metadata:
  name: atelier-postgres-dev
  namespace: default
  labels:
    app: atelier-postgres-dev
spec:
  containers:
    - name: postgres
      # Meme image que le Jalon M6 (docs/specs/PLAN-ACTION-GLOBAL.md,
      # postgresql-statefulset.yaml) : PostgreSQL 16 avec l'extension
      # pgvector precompilee, pour rester compatible avec le futur usage
      # RAG du Jalon M5 (`atelier_pm`) sans avoir a changer d'image plus
      # tard. Non utilisee pour l'instant (M1 ne cree aucune colonne
      # vector).
      image: pgvector/pgvector:pg16
      env:
        - name: POSTGRES_USER
          value: atelier_admin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atelier-postgres-dev
              key: POSTGRES_PASSWORD
        # Cree automatiquement au premier demarrage (image officielle
        # postgres) ; les autres bases par composant (voir README.md) sont
        # creees a la main juste apres, le mecanisme d'init de l'image
        # n'en supportant qu'une seule via cette variable.
        - name: POSTGRES_DB
          value: atelier_apiserver
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
  volumes:
    # emptyDir : donnees perdues a la suppression du pod, comme
    # deploy/dev/kanidm et deploy/dev/openbao (mode dev, pas de
    # persistance visee).
    - name: data
      emptyDir: {}
    - name: init-scripts
      configMap:
        name: atelier-postgres-dev-init
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-postgres-dev
  namespace: default
spec:
  selector:
    app: atelier-postgres-dev
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
