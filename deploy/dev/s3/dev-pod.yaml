apiVersion: v1
kind: Secret
metadata:
  name: atelier-s3-dev
  namespace: default
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: atelier-rustfs-access-key
  RUSTFS_SECRET_KEY: atelier-rustfs-secret-key
---
apiVersion: v1
kind: Pod
metadata:
  name: atelier-s3-dev
  namespace: default
  labels:
    app: atelier-s3-dev
spec:
  initContainers:
    - name: init-buckets
      image: busybox:latest
      command:
        - "sh"
        - "-c"
        - "mkdir -p /data/atelier-sessions /data/atelier-snapshots /data/forgejo-lfs-attachments /data/atelier-qa-evidence && chown -R 10001:10001 /data && chmod -R 775 /data"
      volumeMounts:
        - name: data
          mountPath: /data
  containers:
    - name: rustfs
      image: rustfs/rustfs:latest
      env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: atelier-s3-dev
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: atelier-s3-dev
              key: RUSTFS_SECRET_KEY
      ports:
        - name: s3-api
          containerPort: 9000
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-s3-dev
  namespace: default
spec:
  selector:
    app: atelier-s3-dev
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
  type: ClusterIP
