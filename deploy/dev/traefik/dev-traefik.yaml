apiVersion: v1
kind: ServiceAccount
metadata:
  name: atelier-traefik-dev
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atelier-traefik-dev
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atelier-traefik-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atelier-traefik-dev
subjects:
  - kind: ServiceAccount
    name: atelier-traefik-dev
    namespace: default
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-traefik-dev
  namespace: default
  labels:
    app: atelier-traefik-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atelier-traefik-dev
  template:
    metadata:
      labels:
        app: atelier-traefik-dev
    spec:
      serviceAccountName: atelier-traefik-dev
      # `hostNetwork` (pas un Service NodePort) pour lier directement le
      # port 80 standard sur l'IP du node kind : un Service `NodePort` ne
      # peut pas utiliser 80 sans elargir `--service-node-port-range` cote
      # API server (non configure sur ce cluster) ; `hostNetwork` contourne
      # cette limite en liant le port dans l'espace de noms reseau du node
      # lui-meme, comme le ferait un vrai ingress bare-metal. `dnsPolicy`
      # requis avec `hostNetwork: true` pour que la resolution des Services
      # internes (`atelier-keycloak-dev`, etc.) continue de fonctionner.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
            - --entrypoints.web.address=:80
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
---
# Tableau de bord Traefik (debug uniquement) : ClusterIP normal, pas
# expose sur le node — `kubectl port-forward svc/atelier-traefik-dashboard
# 8081:8080` puis http://127.0.0.1:8081/dashboard/ au besoin.
apiVersion: v1
kind: Service
metadata:
  name: atelier-traefik-dashboard
  namespace: default
spec:
  selector:
    app: atelier-traefik-dev
  ports:
    - port: 8080
      targetPort: 8080
