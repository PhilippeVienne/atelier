apiVersion: v1
kind: Secret
metadata:
  name: atelier-keycloak-dev
  namespace: default
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: dev-only-not-for-production
---
apiVersion: v1
kind: Pod
metadata:
  name: atelier-keycloak-dev
  namespace: default
  labels:
    app: atelier-keycloak-dev
spec:
  containers:
    - name: keycloak
      image: quay.io/keycloak/keycloak:26.1
      args: ["start-dev", "--import-realm"]
      env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://atelier-postgres-dev:5432/keycloak
        - name: KC_DB_USERNAME
          value: atelier_admin
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atelier-postgres-dev
              key: POSTGRES_PASSWORD
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: atelier-keycloak-dev
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atelier-keycloak-dev
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KC_HTTP_PORT
          value: "8080"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_HTTP_RELATIVE_PATH
          value: "/"
      ports:
        - name: http
          containerPort: 8080
      volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
  volumes:
    - name: realm-import
      configMap:
        name: atelier-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-keycloak-dev
  namespace: default
spec:
  selector:
    app: atelier-keycloak-dev
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
