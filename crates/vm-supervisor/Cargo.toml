[package]
name = "atelier-vm-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier-vm-supervisor"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
fctools = { version = "0.7.0-alpha.2", features = ["vm", "jailed-vmm-executor", "unrestricted-vmm-executor", "tokio-runtime", "nix-syscall-backend", "direct-process-spawner"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["user"] }
