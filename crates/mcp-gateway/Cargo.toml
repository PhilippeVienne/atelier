[package]
name = "atelier-mcp-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier-mcp-gateway"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
# `request_simulator` (tache 9.4) : patch `Workshop.spec.simulators` via le
# jeton de service account monte dans le pod (config Kubernetes
# "in-cluster" automatique de kube-rs), jamais un autre acces que celui
# accorde par le Role scope a ce Workshop (voir
# `crates/controller/src/reconcile.rs::ensure_parent_pod_workshop_rbac`).
kube.workspace = true
k8s-openapi.workspace = true
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-streamable-http-server", "server-side-http", "tower"] }
