[package]
name = "atelier-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest.workspace = true
clap = { version = "4", features = ["derive"] }
# Fichier de config `~/.config/atelier/config.yaml` (spec 14 §3.3) : le seul
# format non-JSON de ce workspace, choisi ici pour rester lisible/editable a
# la main par un developpeur (contrairement au JSON, pas d'usage prevu de
# round-trip programmatique cote humain).
serde_yaml = "0.9"
# Repertoire de config natif par OS (XDG sur Linux, %APPDATA% sur Windows,
# Application Support sur macOS) : evite de coder en dur `~/.config`.
dirs = "5"
# Trousseau de cles natif de l'OS (Keychain macOS, Secret Service/libsecret
# sur Linux, Credential Manager Windows) pour les jetons OIDC (spec 14 §3.3) :
# jamais en clair sur disque a cote du fichier de config.
# TODO(9.1, non finalise) : "linux-native" (keyutils, kernel keyring) evite
# la dependance systeme libdbus-1-dev de "sync-secret-service" (pkg-config
# echoue en dev ici) mais n'est pas cross-platform (pas de pendant
# apple-native/windows-native actif) et n'est pas persistant a travers un
# reboot selon la portee du trousseau kernel choisi — a trancher avant de
# considerer 9.1 termine (voir verrou PLAN-ACTION-GLOBAL.md).
keyring = { version = "3", features = ["linux-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
# `atelier server doctor` (tache 9.8) : verification REELLE de l'acces KVM
# (ioctl KVM_GET_API_VERSION), pas seulement l'existence du fichier
# `/dev/kvm` — wrapper sur, aucun `unsafe` cote atelier (regle du projet,
# voir CLAUDE.md) : c'est `kvm-ioctls` (rust-vmm, la meme famille de crates
# que Firecracker lui-meme) qui porte l'`unsafe` necessaire a l'ioctl brut.
kvm-ioctls = "0.19"
indicatif = "0.17"
rand = "0.8"
# `atelier mcp serve` (tache 9.9) : serveur MCP local stdio pour agents
# desktop (Claude Desktop, Cursor), qui relaie vers le vrai serveur MCP
# externe deja expose par `api-server` (`/v1/mcp`, memes outils lifecycle
# que `crates/api-server/src/mcp_server.rs`) — client ET serveur du meme
# SDK, comme `crates/api-server/tests/mcp.rs` (meme pattern de test reel).
rmcp = { version = "3.1.4", features = ["client", "server", "macros", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-io"] }
# `StreamableHttpClientTransportConfig` de rmcp est ecrit contre reqwest
# 0.13 en interne (version differente du reste du workspace, qui est resté
# sur 0.12 — meme situation que `crates/api-server/Cargo.toml`) : alias de
# nom pour ne pas entrer en conflit avec la dependance `reqwest` normale
# de ce crate.
reqwest013 = { package = "reqwest", version = "0.13" }
# Pont tunnels (`atelier port-forward`/`ssh`/`code`, tache 9.2) : meme
# sous-protocole websocket que `crates/api-server/src/portforward.rs`
# (calque sur `portforward.k8s.io`), donc meme client websocket que ce
# crate cote serveur.
tokio-tungstenite = "0.29"
futures-util = "0.3"
http = "1"

[dev-dependencies]
tempfile = "3"
