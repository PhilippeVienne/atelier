[package]
name = "atelier-api-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier-api-server"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
reqwest.workspace = true
rustls.workspace = true
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
# Stockage S3 hybride des archives de session (Jalon M2, cf.
# crates/api-server/src/storage.rs). "rt-tokio" fournit l'implementation
# par defaut du sleep/retry async requise par le client (sinon panique a
# l'execution) et `ByteStream::into_async_read` pour le rejeu en streaming.
aws-sdk-s3 = { version = "1.71", default-features = false, features = ["rustls", "rt-tokio"] }
aws-config = { version = "1.5", default-features = false, features = ["rustls"] }
base64 = "0.22"
# Compression/decompression zstd en streaming (tache 2.1.3/2.1.4) : API
# async-native (AsyncRead -> AsyncRead), pas besoin de charger le flux en
# memoire ni de gerer nous-memes un thread bloquant pour libzstd.
async-compression = { version = "0.4.43", features = ["tokio", "zstd"] }
bytes = "1"
async-trait = "0.1.92"
# Identifiant de session terminal enregistree (crate::session_recorder) :
# deja present transitivement via aws-runtime, declare explicitement car
# utilise directement dans notre propre code.
uuid = { version = "1", features = ["v4"] }
# Serveur MCP externe (Jalon M4, crate::mcp_server) : memes features que
# `crates/mcp-gateway` (transport Streamable HTTP officiel du SDK Rust).
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-streamable-http-server", "server-side-http", "tower"] }
http = "1"

[dev-dependencies]
sha2 = "0.10"
tower = "0.5"
# Client MCP reel pour les tests d'integration de crate::mcp_server (Jalon
# M4) : se connecte au vrai transport Streamable HTTP servi par le routeur,
# plutot que de simuler des requetes JSON-RPC brutes a la main.
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
# `rmcp` (feature transport-streamable-http-client-reqwest) vendorise sa
# propre version de `reqwest` (0.13), distincte de celle du reste du
# workspace (0.12, voir plus haut) : `StreamableHttpClient` n'est implemente
# QUE pour son propre `reqwest::Client`, jamais pour un autre exemplaire du
# meme type venant d'une version differente de la crate (constate a la
# compilation). Alias renomme pour pouvoir construire ce client precis sans
# faire converger tout le workspace vers reqwest 0.13.
reqwest013 = { package = "reqwest", version = "0.13" }
