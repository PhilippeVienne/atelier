[package]
name = "atelier-api-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier-api-server"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
opentelemetry.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
# Un span par requete HTTP (spec docs/specs/12-observabilite.md §4.1) :
# sans lui, aucune requete n'exportait de trace OTLP malgre l'exporteur
# deja cable dans crate::telemetry (verifie empiriquement, session du
# 2026-09-05).
tower-http = { version = "0.6", features = ["trace"] }
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
reqwest.workspace = true
rustls.workspace = true
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
base64 = "0.22"
# Identifiant de session terminal enregistree (crate::session_recorder).
uuid = { version = "1", features = ["v4", "serde"] }
# Serveur MCP externe (Jalon M4, crate::mcp_server) : memes features que
# `crates/mcp-gateway` (transport Streamable HTTP officiel du SDK Rust).
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-streamable-http-server", "server-side-http", "tower"] }
# Client SSH pour exec_in_workshop (crate::exec, Jalon M4, tache 4.2.3) :
# "ring" plutot que le defaut "aws-lc-rs", pour rester sur le meme backend
# crypto que `rustls::crypto::ring` deja utilise ailleurs dans ce crate
# (`main.rs`) — pas de deuxieme implementation crypto dans le meme binaire.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
http = "1"

[dev-dependencies]
tower = "0.5"
# Genere une paire de cles SSH de test (tests/exec.rs) et fait tourner un
# serveur SSH minimal (`russh::server`) pour valider `crate::exec` sans
# microVM Firecracker reelle. Version 0.10 precisement : c'est celle
# qu'exige `ssh-key` (vendorisee par `russh` 0.63), pas celle du `rand`
# "generaliste" (0.8/0.9 coexistent ailleurs dans le graphe de dependances)
# — constate a la compilation (erreurs de trait bound sinon).
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
# Client MCP reel pour les tests d'integration de crate::mcp_server (Jalon
# M4) : se connecte au vrai transport Streamable HTTP servi par le routeur,
# plutot que de simuler des requetes JSON-RPC brutes a la main.
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
# `rmcp` (feature transport-streamable-http-client-reqwest) vendorise sa
# propre version de `reqwest` (0.13), distincte de celle du reste du
# workspace (0.12, voir plus haut) : `StreamableHttpClient` n'est implemente
# QUE pour son propre `reqwest::Client`, jamais pour un autre exemplaire du
# meme type venant d'une version differente de la crate (constate a la
# compilation). Alias renomme pour pouvoir construire ce client precis sans
# faire converger tout le workspace vers reqwest 0.13.
reqwest013 = { package = "reqwest", version = "0.13" }
