[package]
name = "atelier-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier-controller"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
tokio.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures = "0.3"
serde_yaml = "0.9"
reqwest.workspace = true
# Meme version qu'`atelier-api-server` (`crates/api-server/src/vscode.rs`) :
# parler au protocole `portforward` de `net-proxy` pour sonder qu'un port du
# guest (ttyd) repond reellement, avant de marquer le Workshop `Running` —
# le pod Kubernetes du parent peut etre `Running` bien avant que systemd,
# a l'interieur de la microVM, ait fini de demarrer ce service.
tokio-tungstenite = "0.29"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
