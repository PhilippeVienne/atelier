[package]
name = "atelier-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "atelier-controller"
path = "src/main.rs"

[dependencies]
atelier-common = { path = "../common" }
tokio.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures = "0.3"
serde_yaml = "0.9"
reqwest.workspace = true
# Generation du mot de passe de session (Basic Auth code-server/ttyd), voir
# `crates/controller/src/openbao.rs::ensure_session_auth`.
rand = "0.8"
# Meme version qu'`atelier-api-server` (`crates/api-server/src/vscode.rs`) :
# parler au protocole `portforward` de `net-proxy` pour sonder qu'un port du
# guest (ttyd) repond reellement, avant de marquer le Workshop `Running` —
# le pod Kubernetes du parent peut etre `Running` bien avant que systemd,
# a l'interieur de la microVM, ait fini de demarrer ce service.
tokio-tungstenite = "0.29"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
# Serveur HTTP des sondes de sante (`GET /health/ready`), voir
# `crates/controller/src/health.rs`.
axum.workspace = true
# Generation de la paire de cles SSH par Workshop (Jalon M4, tache 4.2.3,
# voir `crates/controller/src/openbao.rs::ensure_ssh_key`) : format OpenSSH
# natif (`to_openssh`/pubkey `to_string`), directement consommable par
# `authorized_keys` cote guest et par le client `russh` cote `api-server`.
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
