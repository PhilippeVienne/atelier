[package]
name = "atelier-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest.workspace = true
tokio.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
# Validation stricte d'un CA bundle PEM avant de le passer a
# `reqwest::Certificate::from_pem` (tache 11.1) : verifie empiriquement que
# `from_pem` ACCEPTE silencieusement un contenu totalement invalide (bytes
# arbitraires, ou un bloc PEM avec un corps base64 corrompu) sans jamais
# retourner d'erreur ni au parsing ni a `ClientBuilder::build()` — un CA
# d'entreprise mal colle dans les values Helm serait donc ignore en silence,
# avec un `CERTIFICATE_VERIFY_FAILED` opaque bien plus tard au premier appel
# reseau. `rustls-pemfile` (deja une dependance transitive de `reqwest`/
# `rustls` dans ce workspace, epingle ici en direct) decode reellement la
# structure DER de chaque certificat PEM avant de faire confiance au bundle.
rustls-pemfile = "2"
# Stockage S3 hybride (`crate::storage`, deplace depuis `crates/api-server`
# a la tache 8.2 pour etre partage par `image-builder`/`vm-supervisor`,
# spec docs/specs/13-image-cache-offload.md §3.3). "rt-tokio" fournit
# l'implementation par defaut du sleep/retry async requise par le client
# (sinon panique a l'execution) et `ByteStream::into_async_read` pour le
# rejeu en streaming.
aws-sdk-s3 = { version = "1.71", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Compression/decompression zstd en streaming : API async-native
# (AsyncRead -> AsyncRead), pas besoin de charger le flux en memoire ni de
# gerer nous-memes un thread bloquant pour libzstd.
async-compression = { version = "0.4.43", features = ["tokio", "zstd"] }
bytes = "1"
async-trait = "0.1.92"
sha2 = "0.10"
# Signature HMAC-SHA256 du jeton d'escouade inter-Workshops (`crate::
# squad_token`, tache 12.2, spec docs/specs/16-escouades-multi-agents-
# swarms-mesh.md §3.2).
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
