[package]
name = "atelier-firecracker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
fctools = { version = "0.7.0-alpha.2", features = ["vm", "jailed-vmm-executor", "unrestricted-vmm-executor", "tokio-runtime", "nix-syscall-backend", "direct-process-spawner", "link-local-extension"] }
cidr = "0.3.2"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["user"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
