name: Publish Container Images to GHCR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: atelier-api-server
            context: .
            dockerfile: crates/api-server/Dockerfile
          - name: atelier-builder-vm-init
            context: .
            dockerfile: crates/builder-vm-init/Dockerfile
          - name: atelier-controller
            context: .
            dockerfile: crates/controller/Dockerfile
          - name: atelier-identity-proxy
            context: .
            dockerfile: crates/identity-proxy/Dockerfile
          - name: atelier-image-builder
            context: .
            dockerfile: crates/image-builder/Dockerfile
          - name: atelier-kvm-device-plugin
            context: .
            dockerfile: crates/kvm-device-plugin/Dockerfile
          - name: atelier-mcp-gateway
            context: .
            dockerfile: crates/mcp-gateway/Dockerfile
          - name: atelier-net-proxy
            context: .
            dockerfile: crates/net-proxy/Dockerfile
          - name: atelier-vm-supervisor
            context: .
            dockerfile: crates/vm-supervisor/Dockerfile
          - name: atelier-dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
          - name: atelier-pm-engine
            context: services/pm-engine
            dockerfile: services/pm-engine/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Firecracker Assets and Crane Binary
        run: |
          ./deploy/dev/firecracker/fetch-test-assets.sh
          mkdir -p deploy/dev/crane
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" | tar xz -C deploy/dev/crane crane
          chmod +x deploy/dev/crane/crane

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
