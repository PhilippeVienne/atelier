site_name: Atelier — MicroVM Dev Environments for AI Agents
site_description: Documentation et site officiel du projet Atelier (Firecracker, Kubernetes, MCP, OpenBao)
site_author: Philippe Vienne

theme:
  name: material
  language: fr
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

nav:
  - 🏠 Présentation: index.md
  - 👤 Espace Utilisateur:
      - Guide de prise en main: user-guide.md
  - 💻 Espace Développeur & Architecture:
      - Vue d'ensemble Architecture: ARCHITECTURE.md
      - Sécurité Réseau & Proxies: architecture/network-security.md
      - Identités & Secrets (Kanidm / OpenBao): architecture/identity-secrets.md
      - Snapshot RAM & Reprise microVM: architecture/snapshot-restore.md
      - Guide de Déploiement & CI/CD: DEPLOYMENT.md
      - Guide Administrateur (Chart Helm): admin-guide.md
      - Matrice d'Avancement: PROGRESS.md
  - 🤝 Contribution & Communauté:
      - Guide de Contribution: contributing.md
      - Directives Agents IA (Claude / Gemini): agents-guide.md
      - Accord de Licence CLA: cla.md
