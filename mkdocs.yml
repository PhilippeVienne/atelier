site_name: Atelier — MicroVM Dev Environments for AI Agents
site_description: Documentation et site officiel du projet Atelier (Firecracker, Kubernetes, MCP, Keycloak, OpenBao, LangGraph)
site_author: Philippe Vienne
site_url: https://philippevienne.github.io/atelier/

repo_url: https://github.com/PhilippeVienne/atelier
repo_name: PhilippeVienne/atelier
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - "."
        - "docs"
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

nav:
  - 🏠 Présentation: index.md
  - 👤 Espace Utilisateur:
      - Guide de prise en main: user-guide.md
  - 💻 Espace Développeur & Architecture:
      - Vue d'ensemble Architecture: ARCHITECTURE.md
      - Sécurité Réseau & Proxies: architecture/network-security.md
      - Identités & Secrets (Keycloak / OpenBao): architecture/identity-secrets.md
      - Snapshot RAM & Reprise microVM: architecture/snapshot-restore.md
      - Guide de Déploiement & CI/CD: DEPLOYMENT.md
      - Guide Administrateur (Chart Helm): admin-guide.md
      - Journal d'Avancement Empirique: PROGRESS.md
  - 📜 Spécifications Techniques (RFC):
      - 00. Principes d'Architecture & Substituabilité: specs/00-architecture-principles-substitutability.md
      - 01. Keycloak, Forgejo & PostgreSQL: specs/01-keycloak-forgejo-postgres.md
      - 02. Packaging Helm & Guide Admin: specs/02-helm-deployment-admin-doc.md
      - 03. Passerelle LiteLLM & Budgets: specs/03-litellm-proxy.md
      - 04. Serveur MCP Externe (/v1/mcp): specs/04-external-mcp-server.md
      - 05. Moteur DevFactory & LangGraph: specs/05-devfactory-pm-engine.md
      - 06. Dashboard & Cadrage BFF: specs/06-dashboard-architecture-cadrage.md
      - 07. Groupes: specs/07-groupes.md
      - 08. Équipe IT Consultative (PM Engine): specs/08-equipe-it-consultative.md
      - 09. Validation QA Dynamique Post-Merge: specs/09-qa-validation-post-merge.md
      - 10. Installation Single-Node Low-Cost: specs/10-low-cost-single-node-install.md
      - 11. Configuration Admin des Modèles LiteLLM: specs/11-admin-litellm-model-config.md
      - Plan d'Action Global & DoD: specs/PLAN-ACTION-GLOBAL.md
  - 🤝 Communauté & Gouvernance:
      - Guide de Contribution: contributing.md
      - Code de Conduite: code-of-conduct.md
      - Politique de Sécurité: security.md
      - Support & Assistance: support.md
      - Gouvernance du Projet: governance.md
      - Directives Agents IA (Claude / Gemini): agents-guide.md
      - Accord de Licence CLA: cla.md
      - Journal des Modifications (Changelog): changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PhilippeVienne/atelier
      name: Atelier sur GitHub
    - icon: fontawesome/brands/github-alt
      link: https://github.com/PhilippeVienne/atelier/discussions
      name: GitHub Discussions
