site_name: Atelier — MicroVM Dev Environments for AI Agents
site_description: Documentation et site officiel du projet Atelier (Firecracker, Kubernetes, MCP, OpenBao)
site_author: Philippe Vienne

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - 🏠 Présentation: index.md
  - 📖 Guide Utilisateur: user-guide.md
  - 📐 Architecture & Sécurité:
      - Vue d'ensemble: ARCHITECTURE.md
      - Sécurité & Proxies Réseau: architecture/network-security.md
      - Identités & Secrets (Kanidm / OpenBao): architecture/identity-secrets.md
      - Snapshot RAM & Reprise microVM: architecture/snapshot-restore.md
  - 🚀 Déploiement & CI/CD: DEPLOYMENT.md
  - 📊 État du Projet: PROGRESS.md
